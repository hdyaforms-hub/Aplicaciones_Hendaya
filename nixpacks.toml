# Configuración de build para Railway (Nixpacks)
# Instala Python 3 + pdfplumber para procesamiento de PDFs

providers = ["...", "python"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = [
  "...",
  "nodejs_20",
  "python3",
  "python3Packages.pip",
  "python3Packages.pdfplumber"
]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt || true"
]
