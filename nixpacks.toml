# Configuración de build para Railway (Nixpacks)
# Instala Python 3 + pdfplumber, necesarios para el procesamiento de PDFs
# (python_scripts/extract_elementos.py)

[phases.setup]
aptPkgs = ["python3", "python3-pip"]

[phases.install]
cmds = [
  "npm ci",
  "pip3 install --break-system-packages pdfplumber"
]
